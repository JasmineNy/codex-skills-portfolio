<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <dir>/System/Library/Fonts</dir>
  <dir>/System/Library/Fonts/Supplemental</dir>
  <dir>/Library/Fonts</dir>
  <dir prefix="xdg">fonts</dir>

  <alias>
    <family>PingFang SC</family>
    <prefer><family>PingFang SC</family><family>Arial Unicode MS</family></prefer>
  </alias>
  <alias>
    <family>zh-CN</family>
    <prefer><family>PingFang SC</family><family>Arial Unicode MS</family></prefer>
  </alias>
  <alias>
    <family>en-US</family>
    <prefer><family>PingFang SC</family><family>Arial Unicode MS</family></prefer>
  </alias>
  <alias>
    <family>Microsoft YaHei</family>
    <prefer><family>PingFang SC</family><family>Arial Unicode MS</family></prefer>
  </alias>
  <alias>
    <family>微软雅黑</family>
    <prefer><family>PingFang SC</family><family>Arial Unicode MS</family></prefer>
  </alias>
  <alias>
    <family>宋体</family>
    <prefer><family>Songti SC</family><family>Arial Unicode MS</family></prefer>
  </alias>
  <alias>
    <family>SimSun</family>
    <prefer><family>Songti SC</family><family>Arial Unicode MS</family></prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer><family>PingFang SC</family><family>Arial Unicode MS</family><family>Arial</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Songti SC</family><family>Arial Unicode MS</family><family>Times New Roman</family></prefer>
  </alias>
</fontconfig>
